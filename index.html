<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С днём рождения, Олег!</title>
  <style>
    :root { --peach: #e7b8a7; --peach-light: #f9ebe5; --cream: #fffaf7; --wine: #632d3b; --burgundy: #7d263a; --ink: #35272a; --muted: #765c61; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { min-height: 100vh; margin: 0; overflow-x: hidden; color: var(--ink); font-family: Georgia, "Times New Roman", serif; background: var(--cream); }
    .hero { position: relative; display: grid; min-height: 100vh; place-items: center; padding: 28px; overflow: hidden; isolation: isolate; background: radial-gradient(circle at 12% 16%, rgba(231,184,167,.57) 0 11%, transparent 11.3%), radial-gradient(circle at 86% 80%, rgba(125,38,58,.13) 0 15%, transparent 15.3%), linear-gradient(135deg, #fffaf7 0%, #f7ddd4 48%, #ecd0c7 100%); }
    .hero::before, .hero::after { position: absolute; z-index: -1; width: 390px; height: 390px; content: ""; border: 1px solid rgba(99,45,59,.15); border-radius: 50%; }
    .hero::before { top: -160px; right: -110px; }
    .hero::after { bottom: -190px; left: -120px; }
    .hero-card { width: min(760px, 100%); padding: clamp(42px, 8vw, 90px) clamp(25px, 8vw, 88px); text-align: center; background: rgba(255,250,247,.79); border: 1px solid rgba(125,38,58,.18); border-radius: 32px; box-shadow: 0 22px 70px rgba(99,45,59,.18); backdrop-filter: blur(5px); }
    .eyebrow { margin: 0 0 18px; color: var(--burgundy); font-family: Arial, sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--wine); font-size: clamp(3rem, 9vw, 6.7rem); font-weight: 500; letter-spacing: -.05em; line-height: .96; }
    .line { width: 74px; height: 2px; margin: 32px auto; background: var(--burgundy); }
    .intro { max-width: 570px; margin: 0 auto; color: var(--muted); font-size: clamp(1.13rem, 2.5vw, 1.35rem); line-height: 1.78; }
    .open-button { display: inline-flex; align-items: center; gap: 12px; margin-top: 40px; padding: 16px 25px 16px 28px; color: #fff9f5; font-family: Arial, sans-serif; font-size: 1rem; font-weight: 700; text-decoration: none; background: var(--burgundy); border: 1px solid var(--burgundy); border-radius: 999px; box-shadow: 0 10px 24px rgba(125,38,58,.24); transition: transform .25s ease, background .25s ease, box-shadow .25s ease; }
    .open-button:hover, .open-button:focus-visible { background: var(--wine); box-shadow: 0 13px 28px rgba(99,45,59,.31); outline: none; transform: translateY(-3px); }
    .arrow { font-size: 1.4rem; line-height: .8; }
    .hint { margin: 24px 0 0; color: rgba(53,39,42,.6); font-family: Arial, sans-serif; font-size: .82rem; }
    @media (max-width: 540px) { .hero { padding: 16px; } .hero-card { border-radius: 24px; } .open-button { width: 100%; justify-content: center; } }
  </style>
</head>
<body>
  <main class="hero">
    <section class="hero-card" aria-labelledby="page-title">
      <p class="eyebrow">С любовью для тебя</p>
      <h1 id="page-title">С днём рождения,<br>Олег!</h1>
      <div class="line"></div>
      <p class="intro">Этот сайт — маленькая коробочка с нашими самыми тёплыми воспоминаниями и важными пожеланиями, которые так хочется сказать тебе сегодня.</p>
      <a class="open-button" href="wishes.html">Открыть коробочку <span class="arrow" aria-hidden="true">→</span></a>
      <p class="hint">Нажми на кнопку, чтобы перейти к поздравлениям</p>
    </section>
  </main>
</body>
</html>
